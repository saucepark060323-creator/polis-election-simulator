function restore(){
  try {let saved=JSON.parse(localStorage.getItem(STORE_KEY));if(saved&&saved.version===1&&saved.config&&saved.parties?.length&&saved.regions?.length) return normalizeState(saved);}catch(e){}
  return makeState('kr');
}
function normalizeState(s){
  const template=makeState('fiction');
  s.version=1;s.preset=String(s.preset||'fiction');s.name=String(s.name||'나의 국가').slice(0,70);s.flag=String(s.flag||'✦').slice(0,8);s.year=Math.floor(clamp(s.year||2026,1800,2300));
  s.config={...template.config,...s.config};s.config.seats=Math.floor(clamp(s.config.seats,10,900));s.config.localSeats=Math.floor(clamp(s.config.localSeats,0,s.config.seats));s.config.threshold=clamp(s.config.threshold,0,30);s.config.turnout=clamp(s.config.turnout,10,100);s.config.noise=clamp(s.config.noise,0,80);s.config.seed=Math.floor(clamp(s.config.seed,1,999999999));if(!SYSTEMS[s.config.system])s.config.system='mixed';
  s.parties=s.parties.slice(0,22).map((p,i)=>({id:String(p.id||slug()),name:String(p.name||'정당').slice(0,50),color:sanitizeColor(p.color),support:clamp(p.support,0.1,100),ideology:clamp(p.ideology,-100,100)}));
  s.regions=s.regions.slice(0,45).map((r,i)=>({id:String(r.id||slug()),name:String(r.name||'선거구').slice(0,50),seats:Math.floor(clamp(r.seats,1,900)),lean:clamp(r.lean,-100,100),turnout:clamp(r.turnout||65,10,100)}));
  s.issues=(Array.isArray(s.issues)?s.issues:clone(DEFAULT_ISSUES)).slice(0,20).map(q=>({id:String(q.id||slug()),name:String(q.name||'정책'),question:String(q.question||'정책 선택').slice(0,220),desc:String(q.desc||'').slice(0,250),polarity:Number(q.polarity)===1?1:-1,weight:clamp(q.weight||2,1,5)}));
  if(!s.parties.some(p=>p.id===s.player))s.player=s.parties[0].id;
  s.positions=(s.positions&&typeof s.positions==='object')?s.positions:{};
  s.turn=Math.floor(clamp(s.turn,0,MAX_TURNS));s.budget=clamp(s.budget,0,999);
  s.campaignBoost=(s.campaignBoost&&typeof s.campaignBoost==='object')?s.campaignBoost:{};
  s.regionBoost=(s.regionBoost&&typeof s.regionBoost==='object')?s.regionBoost:{};
  s.logs=Array.isArray(s.logs)?s.logs.slice(0,40):[];
  s.history=Array.isArray(s.history)?s.history.slice(0,14):[];
  s.coalition=Array.isArray(s.coalition)?s.coalition.filter(x=>s.parties.some(p=>p.id===x)):[];
  s.electionCount=Math.floor(clamp(s.electionCount,0,9999));
  if(s.result && (!Array.isArray(s.result.parties)||!Number.isFinite(s.result.totalSeats)))s.result=null;
  return s;
}

function parliamentSvg(r){
  const data=r.parties.filter(p=>p.seats>0).sort((a,b)=>a.ideology-b.ideology);
  const total=data.reduce((a,p)=>a+p.seats,0);const nRings=Math.max(6,Math.ceil(Math.sqrt(total)/2.2));const minR=80,maxR=369;
  const widths=Array.from({length:nRings},(_,i)=>(minR+(maxR-minR)*i/Math.max(1,nRings-1)));
  const weights=widths.map(v=>v);const sum=weights.reduce((a,b)=>a+b,0);
  let caps=weights.map(w=>Math.max(1,Math.floor(total*w/sum)));
  let assigned=caps.reduce((a,b)=>a+b,0);
  let order=weights.map((w,i)=>({i,f:total*w/sum-caps[i]})).sort((a,b)=>b.f-a.f);
  for(let i=0;assigned<total;i++,assigned++)caps[order[i%order.length].i]++;
  for(let i=0;assigned>total;i++,assigned--){const idx=order[order.length-1-i%order.length].i;if(caps[idx]>1)caps[idx]--;}
  const colors=[];data.forEach(p=>{for(let i=0;i<p.seats;i++)colors.push(p.color);});
  let idx=0;let circles=[];
  // Fill seats from the left of each ring, preserving left-to-right ideology ordering globally.
  for(let j=0;j<nRings;j++){
    const r0=widths[j];const c=caps[j];const pts=[];
    for(let i=0;i<c;i++){const theta=Math.PI-(i+.5)*Math.PI/c;pts.push({x:450+r0*Math.cos(theta),y:408-r0*Math.sin(theta),theta});}
    for(let i=0;i<c;i++){pts[i].ring=j;pts[i].color=null;}
    circles.push(...pts);
  }
  circles.sort((a,b)=>a.x-b.x || a.ring-b.ring);
  circles.forEach(p=>p.color=colors[idx++]||'#51667d');
  const radius=total>700?2.8:total>420?3.7:total>260?4.4:5.5;
  const svg=circles.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${radius}" fill="${p.color}" opacity=".98"/>`).join('');
  return `<svg class="parliament" viewBox="0 0 900 435" role="img" aria-label="의회 의석 ${total}석 반원형 배치"><path d="M61 408 A389 389 0 0 1 839 408" fill="none" stroke="#324b64" stroke-width="1" stroke-dasharray="3 7"/>${svg}<text x="450" y="362" text-anchor="middle" font-size="34" fill="#e8f5ff" font-weight="800">${number(total)}</text><text x="450" y="386" text-anchor="middle" font-size="13" fill="#859db4">TOTAL SEATS</text></svg>`;
}

function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function allocateWeights(weights,target){
  target=Math.max(0,Math.floor(target));const sum=weights.reduce((a,b)=>a+Math.max(0,b),0);
  if(!sum)return weights.map((_,i)=>i===0?target:0);
  const shares=weights.map(w=>target*Math.max(0,w)/sum);const seats=shares.map(x=>Math.floor(x));let left=target-seats.reduce((a,b)=>a+b,0);
  const ranks=shares.map((x,i)=>({i,frac:x-Math.floor(x)})).sort((a,b)=>b.frac-a.frac||a.i-b.i);
  for(let j=0;j<left;j++)seats[ranks[j%ranks.length].i]++;
  return seats;
}

  const out=votes.map(()=>0);

function regionWeights(region,rng){

        // One synthetic, winner-take-all single-member contest per district seat.
        const factor=Math.exp((rng()+rng()-1)*c.noise/58);
        const score=weights[i]*factor;

      let best=-1,deficit=-Infinity;

        const gap=proportionalTargets[j]-local[j]-list[j];

      if(best<0)break;

  const name=String(sb.splitName||'').trim();if(!name)return toast('신당 이름을 입력해 주세요.');
  const ratio=clamp(sb.splitRatio,5,60)/100;let share=a.support*ratio;
  if(a.support-share<.1||share<.1)return toast('나눌 수 있는 최소 지지 강도가 부족합니다.');
  a.support-=share;const newParty=P(slug(),name,palette[p.length%palette.length],clamp(sb.splitLean,-100,100),share);p.push(newParty);sb.splitName='';
  recordSandbox('신당 분당',`${a.name}에서 ${name}이(가) 분당해 기존 지지 강도의 ${Math.round(ratio*100)}%를 넘겨받았습니다.`);
 }else if(action==='sb-shift'){
  const a=get(sb.shiftA),b=get(sb.shiftB);if(!a||!b||a.id===b.id)return toast('서로 다른 정당을 선택하세요.');
  const x=Math.min(clamp(sb.shiftAmount,.1,20),Math.max(0,a.support-.1));if(x<.1)return toast('이동 가능한 지지 강도가 부족합니다.');
  a.support-=x;b.support+=x;recordSandbox('지지 기반 이동',`${a.name}에서 ${b.name}(으)로 가상 지지 강도 ${fixed(x)}를 이동했습니다.`);
 }else if(action==='sb-event'){
  const a=get(sb.eventParty);if(!a)return toast('이벤트 정당을 선택해 주세요.');const v=clamp(sb.eventImpact,-30,30);
  addCampaignBoost(a.id,v);recordSandbox('정치 이벤트',`${a.name}의 전국 선거 경쟁력에 ${v>=0?'+':''}${v} 가중치를 적용했습니다.`);
 }else if(action==='sb-next'){
  state.year=Math.min(2300,state.year+4);state.turn=0;state.budget=100;state.campaignBoost={};state.regionBoost={};state.positions={};
  state.historicId=null;recordSandbox('다음 총선',`${state.year}년 선거를 시작합니다. 기존 정당과 이념·지지 기반은 유지됩니다.`);
 }else return;
 invalidate();route('sandbox');toast('정치 샌드박스 설정이 반영됐습니다.');
}
render=function(){
 if(page==='history'||page==='sandbox'){
  dom('nav').innerHTML=NAV.map(([id,icon,label])=>`<button class="nav-link ${page===id?'active':''}" data-page="${id}" aria-current="${page===id?'page':'false'}"><span class="nav-symbol">${icon}</span>${label}</button>`).join('');
  dom('top-section').textContent=page==='history'?'역대 선거':'정치 샌드박스';dom('view').innerHTML=page==='history'?renderHistory():renderSandbox();save();
 }else{originalRender();dom('top-section').textContent=({world:'국가 선택',parties:'정당 편집',regions:'선거구 편집',settings:'게임 설정'})[page]||dom('top-section').textContent;}
};
document.addEventListener('click',event=>{
 const historic=event.target.closest('[data-hist]');if(historic){event.preventDefault();event.stopImmediatePropagation();const h=historicById(historic.dataset.hist);if(h)confirmModal('역대 선거 불러오기',`${h.title}로 시나리오를 바꿉니다. 현재 수정 내용은 초기화되므로 필요하다면 먼저 JSON으로 저장하세요.`,()=>loadHistoric(h.id));return;}
 const sbButton=event.target.closest('[data-action^="sb-"]');if(sbButton){event.preventDefault();event.stopImmediatePropagation();if(sbButton.dataset.action==='sb-next')confirmModal('4년 후로 이동',`현재 시나리오에서 ${state.year+4}년 총선으로 진행합니다. 정당은 유지하지만 캠페인은 초기화됩니다.`,()=>applySandboxAction('sb-next'));else applySandboxAction(sbButton.dataset.action);}
},true);
document.addEventListener('change',e=>{if(e.target.matches('[data-sb]')){const k=e.target.dataset.sb;sb[k]=e.target.value;}},true);
render();

  </script>
